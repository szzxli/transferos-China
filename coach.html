<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>学期跟踪 · TransferOS-Global</title>
<link rel="stylesheet" href="css/app.css?v=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c3aed">
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <div class="brand">🧭 学期跟踪</div>
  <div class="sub">逐季记录 GPA · 进度一目了然</div>
</div></div>

<div class="page">
  <div id="emptySlot"></div>

  <div class="card" id="sumCard" hidden>
    <div class="section-title">📊 总览 <span class="hint" id="planName"></span></div>
    <div class="progress"><div class="progress-in" id="allBar" style="width:0%"></div></div>
    <table class="nums">
      <tr><td>已完成学季</td><td id="doneQ">0 / 0</td></tr>
      <tr><td>平均 GPA（已完成学季）</td><td id="avgGpa">—</td></tr>
      <tr><td>总体进度</td><td id="allPct">0%</td></tr>
    </table>
    <div class="hint">GPA 按学季手动填写（0–4.0）；"已完成"的学季才计入平均 GPA。</div>
  </div>

  <div id="qSlot"></div>

  <div class="card svc">
    <div class="section-title">💼 顾问服务</div>
    <div class="svc-row"><b>课程辅导（含班主任管理）</b><span class="price">¥800 / 小时</span></div>
    <p class="hint">一对一课程辅导 + 班主任全程跟进学习进度。</p>
  </div>

  <div class="card">
    <a class="btn ghost" href="track.html">← 返回课程规划</a>
  </div>

  <div class="disclaimer">
    所有记录只保存在本机浏览器（localStorage），不上传任何服务器。<br>
    GPA 为手动记录，仅供自我跟踪，不构成任何官方成绩证明。
  </div>
</div>

<nav class="tabbar">
  <a href="index.html" data-page="index"><span class="ico">🏠</span>首页</a>
  <a href="evaluate.html" data-page="evaluate"><span class="ico">📝</span>评估</a>
  <a href="plan.html" data-page="plan"><span class="ico">🗺️</span>选课</a>
  <a href="track.html" data-page="track"><span class="ico">📅</span>规划</a>
  <a href="transfer.html" data-page="transfer"><span class="ico">🎓</span>转学</a>
  <a href="guide.html" data-page="guide"><span class="ico">📋</span>指南</a>
</nav>
<script src="js/app.js?v=1"></script>
<script>
"use strict";
togNavActive("none");

var track = togGet("track", null);
var coach = togGet("coach", { gpa: {}, status: {}, notes: {} });
var qName = { Fall: "秋季", Winter: "冬季", Spring: "春季", Summer: "夏季" };

function save() { togSet("coach", coach); renderSum(); }

function renderSum() {
  if (!track) return;
  var n = track.plan.length, done = 0, gpas = [];
  track.plan.forEach(function (q, i) {
    if (coach.status[i] === "done") {
      done++;
      var g = parseFloat(coach.gpa[i]);
      if (!isNaN(g) && g >= 0 && g <= 4) gpas.push(g);
    }
  });
  var pct = n ? Math.round(done / n * 100) : 0;
  document.getElementById("allBar").style.width = pct + "%";
  document.getElementById("doneQ").textContent = done + " / " + n;
  document.getElementById("allPct").textContent = pct + "%";
  document.getElementById("avgGpa").textContent = gpas.length
    ? (gpas.reduce(function (a, b) { return a + b; }, 0) / gpas.length).toFixed(2) : "—";
  document.getElementById("planName").textContent =
    track.meta ? track.meta.major + " · " + (track.pace === "1yr" ? "1 年" : "2 年") : "";
}

function render() {
  if (!track || !track.plan || !track.plan.length) {
    document.getElementById("emptySlot").innerHTML =
      '<div class="card"><div class="alert">⚠️ 还没有保存的课程规划。<br><br><a class="btn" href="track.html">去生成规划 →</a></div></div>';
    return;
  }
  document.getElementById("sumCard").hidden = false;
  var slot = document.getElementById("qSlot");
  slot.innerHTML = "";
  var stName = { todo: "未开始", doing: "进行中", done: "已完成" };
  track.plan.forEach(function (q, i) {
    var isSum = q.name === "Summer";
    var courses = q.courses.map(function (c) {
      return '<div class="opt"><span><b>' + esc(c.code) + "</b> " + esc(c.title)
        + ' <span class="hint">' + c.units + " 学分</span></span></div>";
    }).join("") || '<div class="hint">本季无安排</div>';
    var st = coach.status[i] || "todo";
    var card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<div class="section-title">' + (isSum ? "☀️ " : "") + "第 " + (i + 1) + " 季 · " + qName[q.name] + "季"
      + ' <span class="hint">' + q.units + " 学分</span></div>"
      + courses
      + '<div class="field"><label>本季 GPA（0–4.0）</label>'
      + '<input type="number" min="0" max="4" step="0.01" inputmode="decimal" data-gpa="' + i + '" value="' + esc(coach.gpa[i] == null ? "" : coach.gpa[i]) + '" placeholder="如 3.67"></div>'
      + '<div class="field"><label>状态</label><select data-st="' + i + '">'
      + ["todo", "doing", "done"].map(function (k) {
          return '<option value="' + k + '"' + (st === k ? " selected" : "") + ">" + stName[k] + "</option>";
        }).join("") + "</select></div>"
      + '<div class="field"><label>笔记（难点 / 待办 / 老师评价…）</label>'
      + '<textarea rows="2" data-note="' + i + '" placeholder="记一点这一季的情况">' + esc(coach.notes[i] || "") + "</textarea></div>";
    slot.appendChild(card);
  });
  slot.querySelectorAll("[data-gpa]").forEach(function (el) {
    el.addEventListener("change", function () {
      var v = parseFloat(el.value);
      if (el.value !== "" && (isNaN(v) || v < 0 || v > 4)) {
        alert("GPA 请填 0–4.0 之间的数字"); el.value = coach.gpa[el.getAttribute("data-gpa")] || ""; return;
      }
      coach.gpa[el.getAttribute("data-gpa")] = el.value; save();
    });
  });
  slot.querySelectorAll("[data-st]").forEach(function (el) {
    el.addEventListener("change", function () {
      coach.status[el.getAttribute("data-st")] = el.value; save();
    });
  });
  slot.querySelectorAll("[data-note]").forEach(function (el) {
    el.addEventListener("change", function () {
      coach.notes[el.getAttribute("data-note")] = el.value; save();
    });
  });
  renderSum();
}

render();
</script>
</body>
</html>
