<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>在线评估 · TransferOS-China</title>
<link rel="stylesheet" href="css/app.css?v=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c3aed">
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <div class="brand">📝 在线评估</div>
  <div class="sub">4 个维度 · 约 2 分钟 · 纯本地判定</div>
</div></div>

<div class="page">
  <div class="step-label" id="stepLabel">第 1 步 / 共 4 步</div>
  <div class="steps"><div class="dot on" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div><div class="dot" id="d4"></div></div>

  <!-- Step 1: 方式 -->
  <div class="card" id="step1">
    <div class="section-title">🎚️ 你打算怎么读 CC？</div>
    <div class="hint">两种方式费用和签证要求完全不同，先选再评估。</div>
    <label class="radio-card"><input type="radio" name="mode" value="online" checked> 💻 纯线上 — 人在中国，全程网课，无需签证</label>
    <label class="radio-card"><input type="radio" name="mode" value="inperson"> ✈️ 赴美线下 — 持 F-1 签证赴美读</label>
    <div class="btn-row"><button class="btn ghost" disabled>← 上一步</button><button class="btn" onclick="evNext(1)">下一步 →</button></div>
  </div>

  <!-- Step 2: 年龄 -->
  <div class="card" id="step2" hidden>
    <div class="section-title">🎂 你的年龄？</div>
    <div class="hint">加州社区大学开放申请要求年满 16 周岁。</div>
    <div class="field"><label for="age">年龄（周岁）</label>
      <input type="number" id="age" min="10" max="60" inputmode="numeric" placeholder="例如 20">
    </div>
    <div class="btn-row"><button class="btn ghost" onclick="evGo(1)">← 上一步</button><button class="btn" onclick="evNext(2)">下一步 →</button></div>
  </div>

  <!-- Step 3: 成绩单 -->
  <div class="card" id="step3" hidden>
    <div class="section-title">📄 高中成绩单</div>
    <div class="hint">申请必需材料：高中成绩单英文盖章版。</div>
    <label class="radio-card"><input type="checkbox" id="hasTs"> 我有高中成绩单（或能开到英文盖章版）</label>
    <div class="btn-row"><button class="btn ghost" onclick="evGo(2)">← 上一步</button><button class="btn" onclick="evNext(3)">下一步 →</button></div>
  </div>

  <!-- Step 4: 英语 -->
  <div class="card" id="step4" hidden>
    <div class="section-title">🗣️ 英语成绩</div>
    <div class="hint">常见要求线：Duolingo 105 / 托福 61（具体以学校官网为准）。</div>
    <div class="field"><label for="duo">Duolingo 英语测试</label>
      <select id="duo">
        <option value="none">还没考 / 不填</option>
        <option value="gte105">105 分及以上 ✅</option>
        <option value="90_104">90 – 104 分</option>
        <option value="lt90">90 分以下</option>
      </select></div>
    <div class="field"><label for="toefl">托福 iBT</label>
      <select id="toefl">
        <option value="none">还没考 / 不填</option>
        <option value="gte61">61 分及以上 ✅</option>
        <option value="lt61">61 分以下</option>
      </select></div>
    <div class="btn-row"><button class="btn ghost" onclick="evGo(3)">← 上一步</button><button class="btn" onclick="evFinish()">看评估结果 →</button></div>
  </div>

  <div id="resultSlot"></div>
  <div class="card">
    <div class="section-title">📜 国内已修课程？</div>
    <p class="hint">在国内大学上过课？解析一下哪些能折抵 CC 学分，省学费。</p>
    <a class="btn ghost" href="transcript.html">成绩单解析 →</a>
  </div>
</div>

<nav class="tabbar">
  <a href="index.html" data-page="index"><span class="ico">🏠</span>首页</a>
  <a href="evaluate.html" data-page="evaluate" class="active"><span class="ico">📝</span>评估</a>
  <a href="plan.html" data-page="plan"><span class="ico">🗺️</span>选课</a>
  <a href="track.html" data-page="track"><span class="ico">🗓️</span>规划</a>
  <a href="transfer.html" data-page="transfer"><span class="ico">🎓</span>转学</a>
  <a href="guide.html" data-page="guide"><span class="ico">📋</span>指南</a>
  <a href="whitelist.html" data-page="whitelist"><span class="ico">✅</span>白名单</a>
</nav>
<div id="chatRoot"></div>
<script src="js/app.js?v=1"></script>
<script src="js/chat.js?v=1"></script>
<script>
"use strict";
togNavActive("evaluate");

/* ---- 纯逻辑：可在 node 里单元测试 ---- */
var AGE_BAR = 16, ESL_PER_UNIT = 284, ESL_UNITS = 10; /* 2门×5学分，估算 */
function evaluateEligibility(a) {
  var dims = [], esl = null;
  /* 年龄 */
  var age = parseInt(a.age, 10);
  if (isNaN(age)) {
    dims.push({ key: "age", st: "missing", label: "年龄", msg: "未填写", fix: "请填写年龄。" });
  } else if (age < AGE_BAR) {
    dims.push({ key: "age", st: "bad", label: "年龄", msg: age + " 岁，未满 16 岁",
      fix: "加州社区大学开放申请要求年满 16 周岁，请达到年龄后再申请。" });
  } else {
    dims.push({ key: "age", st: "ok", label: "年龄", msg: age + " 岁，达到 16 岁门槛", fix: "" });
  }
  /* 成绩单 */
  if (a.hasTranscript) {
    dims.push({ key: "ts", st: "ok", label: "高中成绩单", msg: "有（英文盖章版）", fix: "" });
  } else {
    dims.push({ key: "ts", st: "warn", label: "高中成绩单", msg: "尚未确认",
      fix: "去高中教务处开英文盖章版成绩单，这是申请必需材料。" });
  }
  /* 英语 */
  var engOk = (a.duo === "gte105") || (a.toefl === "gte61");
  var engTried = (a.duo !== "none") || (a.toefl !== "none");
  if (engOk) {
    dims.push({ key: "eng", st: "ok", label: "英语", msg: "达到常见要求线", fix: "" });
  } else if (engTried) {
    var cost = ESL_PER_UNIT * ESL_UNITS;
    esl = { cost: cost, quarters: 2 };
    dims.push({ key: "eng", st: "warn", label: "英语", msg: "低于常见要求线（Duolingo 105 / 托福 61）",
      fix: "两条路：① 刷分到线；② 先修 CC 的 ESL 语言桥梁课——约 2 门×5 学分×$284 = $" + cost.toLocaleString("en-US")
        + "，约 2 个 quarter（估算，实际以入学 placement test 为准）。" });
  } else {
    dims.push({ key: "eng", st: "warn", label: "英语", msg: "还没考",
      fix: "先去考 Duolingo（出分快、便宜）或托福，目标 Duolingo 105 / 托福 61。" });
  }
  var verdict;
  if (dims.some(function (d) { return d.st === "bad" || d.st === "missing"; })) verdict = "bad";
  else if (dims.some(function (d) { return d.st === "warn"; })) verdict = "warn";
  else verdict = "ok";
  var modeNote = "";
  if (a.mode === "inperson") {
    modeNote = '<div class="alert" style="margin-top:10px">🛂 你选了<b>赴美线下</b>：F-1 签证需要资金证明覆盖约 <b>$27,189/年</b>（De Anza 官网估算，无例外），另需购买强制医疗保险。</div>';
  } else {
    modeNote = '<div class="hint" style="margin-top:10px">💻 你选了<b>纯线上</b>：人在中国即可开始，无需签证；转学到 UC 后再申请 F-1（<a href="guide.html#visa">必读签证风险</a>）。</div>';
  }
  return { dims: dims, verdict: verdict, esl: esl, mode: a.mode, modeNote: modeNote };
}
if (typeof module !== "undefined") { module.exports = { evaluateEligibility: evaluateEligibility }; }

/* ---- 页面交互 ---- */
function evGo(n) {
  [1, 2, 3, 4].forEach(function (i) {
    document.getElementById("step" + i).hidden = (i !== n);
    document.getElementById("d" + i).classList.toggle("on", i <= n);
  });
  document.getElementById("stepLabel").textContent = "第 " + n + " 步 / 共 4 步";
  document.getElementById("resultSlot").innerHTML = "";
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function evRead() {
  var modeEl = document.querySelector('input[name="mode"]:checked');
  return {
    mode: modeEl ? modeEl.value : "online",
    age: document.getElementById("age").value.trim(),
    hasTranscript: document.getElementById("hasTs").checked,
    duo: document.getElementById("duo").value,
    toefl: document.getElementById("toefl").value,
  };
}
function evNext(n) {
  togSet("eval", { raw: evRead() });
  evGo(n + 1);
}
function evFinish() {
  var ans = evRead();
  var r = evaluateEligibility(ans);
  togSet("eval", { mode: ans.mode, verdict: r.verdict, esl: !!r.esl, raw: ans, ts: Date.now() });
  var icon = { ok: "✅", warn: "⚠️", bad: "❌", missing: "❓" };
  var rows = r.dims.map(function (d) {
    return '<div class="dim-row"><span class="dim-ico">' + icon[d.st] + '</span><div><b>' + esc(d.label) + '</b> — ' + esc(d.msg)
      + (d.fix ? '<div class="fix">→ ' + esc(d.fix) + '</div>' : '') + '</div></div>';
  }).join("");
  var vHtml;
  if (r.verdict === "ok") vHtml = '<div class="verdict ok">✅ 路径可行：四个维度都达标，去选课吧。</div>';
  else if (r.verdict === "warn") vHtml = '<div class="verdict warn">⚠️ 补齐短板：按上面的提示处理，路径即可走通。</div>';
  else vHtml = '<div class="verdict bad">❌ 暂不符合：有红色硬伤，按提示处理后再来。</div>';
  document.getElementById("resultSlot").innerHTML =
    '<div class="card"><div class="section-title">📊 评估结果</div>' + rows + vHtml + r.modeNote
    + '<a class="btn" href="plan.html">下一步：去选课 →</a>'
    + '<div class="footnote">纯本地判定，仅供参考，不构成录取承诺。语言要求线为常见值，具体以学校官网为准；ESL 费用为估算。</div></div>';
  document.getElementById("resultSlot").scrollIntoView({ behavior: "smooth" });
}
(function () {
  var s = togGet("eval", null);
  if (!s || !s.raw) return;
  if (s.raw.mode) { var m = document.querySelector('input[name="mode"][value="' + s.raw.mode + '"]'); if (m) m.checked = true; }
  if (s.raw.age) document.getElementById("age").value = s.raw.age;
  if (s.raw.hasTranscript) document.getElementById("hasTs").checked = true;
  if (s.raw.duo) document.getElementById("duo").value = s.raw.duo;
  if (s.raw.toefl) document.getElementById("toefl").value = s.raw.toefl;
})();
document.querySelectorAll(".radio-card").forEach(function (c) {
  c.addEventListener("click", function () {
    var inp = c.querySelector("input");
    if (inp.type === "radio") {
      document.querySelectorAll('input[name="' + inp.name + '"]').forEach(function (x) {
        x.closest(".radio-card").classList.remove("sel");
      });
      c.classList.add("sel");
    } else { c.classList.toggle("sel", inp.checked); }
  });
});
</script>
</body>
</html>
