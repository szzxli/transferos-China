<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>导师工作台 · TransferOS</title>
<meta name="theme-color" content="#16453a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <span class="logo" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0f332b"/><path d="M18 20h28v7H36v20h-8V27H18z" fill="#c9f06b"/></svg></span>
    <span class="topbar-title" data-i18n="app.title">导师工作台</span>
    <button id="lang-toggle" class="lang-toggle" type="button" aria-label="Language / 语言"><span id="lang-zh" class="on">中</span><span class="lang-sep">|</span><span id="lang-en">EN</span></button>
  </div>
</header>
<main>
  <section id="gate" class="card gate" hidden>
    <h1 data-i18n="gate.title">输入导师专属信息</h1>
    <p class="mut" data-i18n="gate.desc">链接里已带好工号与密钥时会自动进入；也可以手动填写（向管理员索取你的专属链接）。</p>
    <form id="gate-form">
      <label><span data-i18n="gate.s">导师工号 / 编号</span>
        <input id="gate-s" type="text" autocomplete="off" autocapitalize="none" data-i18n-ph="gate.sph" placeholder="如 EMP-001"></label>
      <label><span data-i18n="gate.k">导师密钥</span>
        <input id="gate-k" type="text" autocomplete="off" autocapitalize="none" data-i18n-ph="gate.kph" placeholder="如 mk_…"></label>
      <p id="gate-err" class="err" hidden></p>
      <button class="btn-primary" type="submit" data-i18n="gate.btn">进入工作台</button>
    </form>
  </section>

  <section id="state" class="card state" hidden>
    <p id="state-text" data-i18n="state.loading">正在加载…</p>
    <button id="state-retry" class="btn-ghost" type="button" hidden data-i18n="state.retry">重试</button>
  </section>

  <div id="app" hidden>
    <section class="card hero">
      <div class="hero-head">
        <h1 id="m-name"></h1>
        <span class="pill" id="m-status"></span>
      </div>
      <p class="exclusive" data-i18n="hero.exclusive">导师专属 · 名下学生方案层动态</p>
      <p class="mut" id="m-note" data-i18n="hero.note">这里只显示你名下学生的方案层内容：近期动态、她的需求与待回复留言。学生的私密空间与家长通道内容不在这里。</p>
    </section>
    <div id="students"></div>
    <p class="foot"><a href="#" id="forget" data-i18n="foot.forget">忘记已保存的链接信息</a></p>
  </div>
</main>
<script src="mentor.js"></script>
</body>
</html>
