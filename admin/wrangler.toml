name = "transferos-admin"
main = "src/index.js"
compatibility_date = "2025-01-01"
# 可选 Secret（在 Cloudflare 控制台 Settings → Variables and Secrets 配置，切勿把值写进本文件）：
# RESEND_API_KEY —— 系统自动邮件通知（Resend）的发信密钥；配好后，通知偏好为邮箱的导师由系统自动发信，未配置则维持人工转达。

[[d1_databases]]
binding = "DB"
database_name = "transferos-admin"
# 注意：如果部署时提示找不到 D1 数据库，请先去 Cloudflare 后台
# Workers & Pages -> D1 里新建一个名为 transferos-admin 的数据库，
# 然后把它的 database_id 粘到这里（取消下一行的注释）：
# database_id = "请粘贴你的数据库 ID"

# v17 导师文件一次性投递：R2 对象存储绑定。桶 transferos-files 需先在
# Cloudflare 后台 R2 里手动创建（步骤见 README「准备 R2 文件存储」），
# 桶不存在时部署会报错；绑定缺失时上传/下载接口返回 files_not_configured。
[[r2_buckets]]
binding = "FILES"
bucket_name = "transferos-files"

# v17 定时清扫：每 15 分钟一次，扫满 24h 未下载的导师文件（删 R2 对象并置 expired）
[triggers]
crons = ["*/15 * * * *"]

