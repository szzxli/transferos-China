<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>课程规划 · TransferOS-Global</title>
<link rel="stylesheet" href="css/app.css?v=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c3aed">
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <div class="brand">📅 课程规划</div>
  <div class="sub">Quarter 学季制 · 1 年 / 2 年转学节奏</div>
</div></div>

<div class="page">
  <div id="evalBanner"></div>
  <div class="alert">
    <b>📌 先说明：</b>De Anza / Foothill 实行 <b>Quarter 学季制</b>（Fall / Winter / Spring / Summer），不是 Semester 学期制。下面的"季"指学季。
  </div>

  <div class="card">
    <div class="section-title">📥 数据来源</div>
    <label class="radio-card"><input type="radio" name="src" value="plan" checked> 用我在「选课」页保存的最新计划</label>
    <label class="radio-card"><input type="radio" name="src" value="new"> 重新选学校 / UC / 专业</label>
    <div class="hint" id="srcHint"></div>
  </div>

  <div class="card" id="pickCard" hidden>
    <div class="section-title">🎯 重新选择</div>
    <div class="field"><label>学校</label>
      <label class="radio-card"><input type="radio" name="school" value="deanza" checked> De Anza College</label>
      <label class="radio-card"><input type="radio" name="school" value="foothill"> Foothill College</label>
    </div>
    <div class="field"><label for="ucSel">目标 UC</label><select id="ucSel"></select></div>
    <div class="field"><label for="majorSel">专业</label><select id="majorSel"></select></div>
    <div class="hint" id="loadHint"></div>
  </div>

  <div class="card">
    <div class="section-title">⏱️ 转学节奏</div>
    <label class="radio-card"><input type="radio" name="pace" value="2yr" checked> <b>2 年转学</b>（稳妥）— 7 个学季，每季约 9–10 学分</label>
    <label class="radio-card"><input type="radio" name="pace" value="1yr"> <b>1 年转学</b>（高强度）— Fall / Winter / Spring + Summer 共 4 季，每季约 15 学分</label>
    <div class="btn-row"><button class="btn" id="genBtn">⚙️ 生成课程规划</button></div>
  </div>

  <div id="schedSlot"></div>

  <div class="disclaimer">
    排课为自动估算：<b>课程先后修关系（prerequisite）未纳入</b>，部分课程有先修要求，实际选课顺序请以学校官网和 counselor 确认为准。<br>
    课程要求来自 ASSIST 协议，仅供规划参考。<strong>不承诺录取。</strong>
  </div>
</div>

<nav class="tabbar">
  <a href="index.html" data-page="index"><span class="ico">🏠</span>首页</a>
  <a href="evaluate.html" data-page="evaluate"><span class="ico">📝</span>评估</a>
  <a href="plan.html" data-page="plan"><span class="ico">🗺️</span>选课</a>
  <a href="track.html" data-page="track" class="active"><span class="ico">📅</span>规划</a>
  <a href="transfer.html" data-page="transfer"><span class="ico">🎓</span>转学</a>
  <a href="guide.html" data-page="guide"><span class="ico">📋</span>指南</a>
  <a href="whitelist.html" data-page="whitelist"><span class="ico">✅</span>白名单</a>
</nav>
<div id="chatRoot"></div>
<script src="js/app.js?v=1"></script>
<script src="js/chat.js?v=1"></script>
<script>
"use strict";
renderEvalBanner();
togNavActive("track");

/* ================= 纯逻辑：可在 node 里单元测试 ================= */
var SUMMER_CAP = 8;
function flattenReqs(reqs) {
  return reqs.map(function (rq) {
    var o = rq.options[0] || {};
    var alt = rq.options.length > 1
      ? rq.options.slice(1).map(function (x) { return x.code; }).join(" / ") : "";
    return { code: o.code || "", title: o.title || "", units: o.units || 3, alt: alt };
  });
}
function buildSchedule(reqs, pace) {
  var courses = flattenReqs(reqs);
  var total = courses.reduce(function (a, c) { return a + c.units; }, 0);
  var quarters = pace === "1yr"
    ? ["Fall", "Winter", "Spring", "Summer"]
    : ["Fall", "Winter", "Spring", "Summer", "Fall", "Winter", "Spring"];
  var n = quarters.length;
  var target = n ? Math.ceil(total / n) : 0;
  var plan = quarters.map(function (q) { return { name: q, courses: [], units: 0 }; });
  var qi = 0;
  courses.forEach(function (c) {
    if (qi >= n) qi = n - 1;
    var cap = plan[qi].name === "Summer" ? SUMMER_CAP : Infinity;
    if (plan[qi].courses.length && plan[qi].units + c.units > cap) qi = Math.min(qi + 1, n - 1);
    plan[qi].courses.push(c);
    plan[qi].units += c.units;
    if (plan[qi].units >= target && qi < n - 1) qi++;
  });
  return { plan: plan, total: total, target: target, pace: pace };
}
if (typeof module !== "undefined") { module.exports = { buildSchedule: buildSchedule, flattenReqs: flattenReqs }; }
/* ================= 页面交互 ================= */

var DATA = null, CUR = { school: "deanza", uc: "", major: "", reqs: [] };

function selVal(name) {
  var el = document.querySelector('input[name="' + name + '"]:checked');
  return el ? el.value : "";
}
var UC_SLUGS = {"UC Berkeley":"uc_berkeley","UC Davis":"uc_davis","UC Irvine":"uc_irvine","UC San Diego":"uc_san_diego","UC Santa Cruz":"uc_santa_cruz","UCLA":"ucla"};

function useSavedPlan() {
  var plans = togGet("plans", []);
  var hint = document.getElementById("srcHint");
  if (!plans.length) {
    hint.innerHTML = '⚠️ 还没有保存的选课计划。<a href="plan.html">去选课页做一份 →</a>';
    return null;
  }
  var p = plans[0];
  hint.textContent = "将使用：" + p.major + "（" + p.uc + "，" + new Date(p.ts).toLocaleDateString("zh-CN") + "保存）";
  return p;
}
function loadData(school, cb) {
  document.getElementById("loadHint").textContent = "正在加载课程数据…";
  fetch("data/index.json").then(function (r) { return r.json(); }).then(function (idx) {
    DATA = { school: school, schoolName: (school === "deanza" ? "De Anza College" : "Foothill College"), parts: idx[school], majors: [] };
    CUR.school = school;
    document.getElementById("loadHint").textContent = DATA.schoolName + " 数据索引已加载";
    var sel = document.getElementById("ucSel");
    sel.innerHTML = "";
    Object.keys(DATA.parts).forEach(function (u) {
      var o = document.createElement("option"); o.value = u; o.textContent = u; sel.appendChild(o);
    });
    CUR.uc = sel.value; loadMajors(cb);
  }).catch(function () {
    document.getElementById("loadHint").textContent = "⚠️ 数据加载失败，请刷新重试。";
  });
}
function loadMajors(cb) {
  var n = DATA.parts[CUR.uc], slug = UC_SLUGS[CUR.uc];
  var ps = [];
  for (var i = 1; i <= n; i++) {
    ps.push(fetch("data/" + DATA.school + "-" + slug + "-p" + i + ".json").then(function (r) { return r.json(); }));
  }
  Promise.all(ps).then(function (parts) {
    var majors = [];
    parts.forEach(function (p) { majors = majors.concat(p.majors); });
    DATA.majors = majors;
    buildMajors(); if (cb) cb();
  }).catch(function () {
    document.getElementById("loadHint").textContent = "⚠️ 专业数据加载失败，请重试。";
  });
}
function buildMajors() {
  var sel = document.getElementById("majorSel");
  sel.innerHTML = "";
  (DATA.majors || []).forEach(function (p) {
    var o = document.createElement("option"); o.value = p.major; o.textContent = p.major; sel.appendChild(o);
  });
  if (sel.options.length) { CUR.major = sel.value; }
}
function findReqs(school, uc, major, cb) {
  var done = function () {
    var list = DATA.majors || [], prog = null;
    for (var i = 0; i < list.length; i++) if (list[i].major === major) prog = list[i];
    cb(prog ? { reqs: prog.reqs, year: prog.year } : null);
  };
  var needReload = !DATA || CUR.school !== school || DATA.majors.length === 0 || CUR.uc !== uc;
  if (!needReload) { done(); return; }
  var afterIdx = function () { CUR.uc = uc; loadMajors(done); };
  if (!DATA || CUR.school !== school) loadData(school, afterIdx);
  else afterIdx();
}

document.querySelectorAll('input[name="src"]').forEach(function (el) {
  el.addEventListener("change", function () {
    document.getElementById("pickCard").hidden = (el.value !== "new");
    if (el.value === "new" && !DATA) loadData("deanza");
    else if (el.value === "plan") useSavedPlan();
  });
});
document.querySelectorAll('input[name="school"]').forEach(function (el) {
  el.addEventListener("change", function () { loadData(el.value); });
});
document.getElementById("ucSel").addEventListener("change", function (e) { CUR.uc = e.target.value; loadMajors(); });
document.getElementById("majorSel").addEventListener("change", function (e) { CUR.major = e.target.value; });
document.querySelectorAll(".radio-card").forEach(function (c) {
  c.addEventListener("click", function () {
    var nm = c.querySelector("input").name;
    document.querySelectorAll('input[name="' + nm + '"]').forEach(function (x) {
      x.closest(".radio-card").classList.remove("sel");
    });
    c.classList.add("sel");
  });
});

document.getElementById("genBtn").addEventListener("click", function () {
  var pace = selVal("pace"), src = selVal("src");
  var go = function (reqs, meta) {
    if (!reqs || !reqs.length) {
      document.getElementById("schedSlot").innerHTML =
        '<div class="card"><div class="alert">⚠️ 没找到该专业的课程数据，请换选或先去选课页保存计划。</div></div>';
      return;
    }
    render(reqs, pace, meta);
  };
  if (src === "plan") {
    var p = useSavedPlan();
    if (!p) return;
    findReqs(p.school, p.uc, p.major, function (r) {
      go(r && r.reqs, { school: p.school, uc: p.uc, major: p.major, year: r && r.year });
    });
  } else {
    var school = selVal("school");
    findReqs(school, CUR.uc, CUR.major, function (r) {
      go(r && r.reqs, { school: school, uc: CUR.uc, major: CUR.major, year: r && r.year });
    });
  }
});

function render(reqs, pace, meta) {
  var s = buildSchedule(reqs, pace);
  var qName = { Fall: "秋季", Winter: "冬季", Spring: "春季", Summer: "夏季" };
  var html = '<div class="card"><div class="section-title">🗓️ ' + esc(meta.major) + '</div>'
    + '<div class="hint">' + esc(meta.school) + " → " + esc(meta.uc)
    + (meta.year ? " · 协议 " + esc(meta.year) : "")
    + " · " + (pace === "1yr" ? "1 年转学（4 季）" : "2 年转学（7 季）")
    + " · 共 " + s.total + " 学分，每季目标约 " + s.target + " 学分</div></div>";
  s.plan.forEach(function (q, i) {
    var isSum = q.name === "Summer";
    var rows = q.courses.map(function (c) {
      return '<div class="opt"><span><b>' + esc(c.code) + "</b> " + esc(c.title)
        + ' <span class="hint">' + c.units + " 学分</span>"
        + (c.alt ? ' <span class="tag">或 ' + esc(c.alt) + "</span>" : "") + "</span></div>";
    }).join("") || '<div class="hint">本季无安排</div>';
    html += '<div class="card"><div class="section-title">' + (isSum ? "☀️ " : "")
      + "第 " + (i + 1) + " 季 · " + qName[q.name] + "季"
      + ' <span class="hint">' + q.units + " 学分</span></div>" + rows + "</div>";
  });
  html += '<div class="card"><div class="btn-row">'
    + '<button class="btn" id="saveTrack">💾 保存规划</button>'
    + '<button class="btn ghost" id="regen">🔄 重新生成</button>'
    + '<a class="btn ghost" href="coach.html">学期跟踪 →</a>'
    + '</div><div class="footnote">保存后可在「学期跟踪」里逐季记录 GPA 和进度。</div></div>';
  document.getElementById("schedSlot").innerHTML = html;
  document.getElementById("schedSlot").scrollIntoView({ behavior: "smooth" });
  document.getElementById("saveTrack").addEventListener("click", function () {
    togSet("track", { meta: meta, pace: pace, plan: s.plan, total: s.total, ts: Date.now() });
    alert("规划已保存，去「学期跟踪」开始记录吧。");
  });
  document.getElementById("regen").addEventListener("click", function () {
    document.getElementById("schedSlot").innerHTML = "";
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
}

useSavedPlan();
</script>
</body>
</html>
